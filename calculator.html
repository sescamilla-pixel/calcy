 * {

/* ---------- header ---------- */
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;

}


.navbar {
  width: fit-content;
  margin: 20px auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 40px;
  background: #0d0d1a;
  border: 2px solid #00f0ff;
  border-radius: 8px;
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);

  text-decoration: none;
  justify-content: center;

.navbar ul {
  display: flex;
  gap: 20px;

}

.navbar a {
  text-decoration: none;
}

.navbar li a:hover {
  color: #00f0ff;
  text-decoration: underline;
}


.cv {

  height: 500px;
  justify-content: center;

  margin-left: 5%;

}
